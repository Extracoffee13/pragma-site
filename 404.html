<style>
:root { --void:#0A0A0A; --signal:#1FE07E; --signal-2:#19C46D; --signal-dim:rgba(31,224,126,0.08); --signal-line:rgba(31,224,126,0.18); --output:#FFFFFF; --output-65:rgba(255,255,255,0.65); --output-45:rgba(255,255,255,0.45); --output-30:rgba(255,255,255,0.30); --output-12:rgba(255,255,255,0.12); --output-04:rgba(255,255,255,0.04); }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--void); color:var(--output); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; flex-direction:column; }
a { color:inherit; text-decoration:none; }
::selection { background:var(--signal); color:var(--void); }

nav { padding:22px 56px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--output-04); }
.nav-left { display:flex; align-items:center; gap:13px; }
.nav-wordmark { font-size:20px; font-weight:900; letter-spacing:-0.03em; }
.nav-wordmark .dot { color:var(--signal); }
.nav-cta { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--signal); padding:9px 21px; border:1px solid var(--signal-line); border-radius:100px; letter-spacing:0.05em; }
.nav-cta::before { content:'>_ '; opacity:0.7; }
.nav-cta:hover { background:var(--signal-dim); }

main { flex:1; display:flex; align-items:center; justify-content:center; padding:55px 56px; position:relative; overflow:hidden; }
main::before { content:''; position:absolute; top:-200px; right:-200px; width:600px; height:600px; border-radius:50%; background:radial-gradient(circle, rgba(31,224,126,0.06) 0%, transparent 70%); pointer-events:none; }
.inner { max-width:680px; text-align:center; position:relative; z-index:1; }
.eyebrow { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--signal); letter-spacing:0.25em; text-transform:uppercase; margin-bottom:34px; }
.eyebrow::before { content:'>_ '; opacity:0.6; margin-right:4px; }
.code { font-family:'JetBrains Mono',monospace; font-size:clamp(72px,12vw,160px); font-weight:900; color:var(--signal); letter-spacing:-0.06em; line-height:1; margin-bottom:21px; }
h1 { font-size:clamp(32px,5vw,56px); font-weight:900; letter-spacing:-0.03em; line-height:1.05; margin-bottom:21px; }
h1 .accent { color:var(--signal); }
p { font-size:18px; color:var(--output-65); max-width:520px; margin:0 auto 34px; line-height:1.65; font-weight:300; }
.actions { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
.cta-primary { display:inline-flex; align-items:center; gap:10px; background:var(--signal); color:var(--void); padding:20px 44px; border-radius:100px; font-size:15px; font-weight:700; }
.cta-primary::after { content:'→'; transition:transform 200ms ease; }
.cta-primary:hover { background:var(--signal-2); transform:translateY(-1px); }
.cta-primary:hover::after { transform:translateX(4px); }
.cta-secondary { font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--output-45); padding:20px 24px; border:1px solid var(--output-12); border-radius:100px; letter-spacing:0.05em; }
.cta-secondary::before { content:'>_ '; opacity:0.6; }
.cta-secondary:hover { color:var(--output); border-color:var(--output-30); }

footer { padding:24px 56px; text-align:center; border-top:1px solid var(--output-04); font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--output-30); letter-spacing:0.12em; }
footer .dot { color:var(--signal); }

@media (max-width:720px){ nav,main,footer{padding-left:24px;padding-right:24px} .actions{flex-direction:column;align-items:stretch} }
</style>
</head>
